services:
  postgres:
    image: postgres:17-alpine
    container_name: integraciones-postgres
    environment:
      POSTGRES_USER: integraciones
      POSTGRES_PASSWORD: integraciones
      POSTGRES_DB: integraciones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integraciones"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
