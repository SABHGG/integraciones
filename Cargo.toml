[workspace]
resolver = "2"
members = ["crates/core", "crates/sandbox", "crates/engine", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# dominio / serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# async / http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# persistencia
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "chrono", "migrate"] }

# sandbox
rquickjs = { version = "0.9", features = ["full-async"] }

# observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TypeScript → JavaScript al publicar una versión de bloque (design.md: el
# pipeline corre al publicar, nunca en runtime).
# Versión fijada a la última estable al construir la tarea 4.1 (82.1.1, publicada
# el 2026-10-15): los crates internos de swc cambian de API entre majors, así
# que se ancla el major y se activa solo el subconjunto necesario (parser TS,
# codegen, transform de TypeScript) para no arrastrar bundler/minifier/CSS.
swc_core = { version = "82.1.1", features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_codegen",
    "ecma_transforms_typescript",
] }

# utilidades
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
serde_urlencoded = "0.7"
dotenvy = "0.15"
tower = { version = "0.5", features = ["util"] }

# crates internos
domain = { path = "crates/core" }
sandbox = { path = "crates/sandbox" }
engine = { path = "crates/engine" }

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
