[workspace]
resolver = "2"
members = ["crates/core", "crates/sandbox", "crates/engine", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# dominio / serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# async / http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# persistencia
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "chrono", "migrate"] }

# sandbox
rquickjs = { version = "0.9", features = ["full-async"] }

# observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utilidades
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
dotenvy = "0.15"

# crates internos
domain = { path = "crates/core" }
sandbox = { path = "crates/sandbox" }
engine = { path = "crates/engine" }

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
