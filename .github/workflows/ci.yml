# CI en paralelo por categoría (plan 2026-10-19):
#
#   fmt ──────────── estilo (sin cache, falla en <1 min)
#   clippy ────────── lints del workspace (rust-cache)
#   unit ──────────── todo el workspace SIN DATABASE_URL: los suites de
#                     integración se omiten con eprintln; además ejercita el
#                     camino de skip (regresión del contrato "CI verde sin BD")
#   api ───────────── suites que comparten la BD `integraciones`
#   engine ────────── cola de ejecuciones (BD `integraciones_engine`)
#   scheduler ─────── scheduler cron (BD `integraciones_scheduler`)
#   e2e ───────────── e2e MVP2 (BD `integraciones_e2e`)
#
# Cada job de integración levanta SU PROPIO Postgres: las colas (executions,
# webhook_deliveries) son globales con SKIP LOCKED y las suites usan DB_LOCK
# por proceso — aislar por job es lo que permite ejecutar todo en paralelo sin
# carreras (mismo aislamiento que dev-postgres.sh en local).
#
# cargo-nextest quedó descartado a propósito: corre cada test en un proceso
# distinto y rompería el DB_LOCK intra-binario de las suites que comparten BD.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos del mismo PR; en main nunca (queremos el veredicto
# completo de cada push).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check

  clippy:
    name: lints (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: test unitario (sin BD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Sin DATABASE_URL a propósito: los suites de integración se omiten y
      # queda demostrado que el árbol compila y pasa sin base de datos.
      - name: Test sin base de datos
        run: cargo test --workspace

  # ── integración: un job por base de datos ─────────────────────────────

  api:
    name: test api (integraciones)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integraciones
          POSTGRES_PASSWORD: integraciones
          POSTGRES_DB: integraciones
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U integraciones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Consola embebida (MVP3): los assets deben existir para que el test de
      # serving de /console encuentre el dist construido (no el stub).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build y tests de la consola
        run: |
          npm ci
          npm run build
          npm test
        working-directory: console
      - name: Suites de la API (BD compartida `integraciones`)
        run: |
          cargo test -p api --lib --test blocks_api --test bridges_api \
            --test builtin_http_api --test console_api --test credentials_api --test e2e_demo \
            --test events_api --test executions_api --test executions_pasos_api --test retention_api --test stats_api --test users_api --test webhooks_api
        env:
          DATABASE_URL: postgres://integraciones:integraciones@127.0.0.1:5433/integraciones
          # Clave de bóveda solo para CI (no es un secreto): ejercita el
          # camino de VAULT_KEY en vez de la clave efímera por proceso.
          VAULT_KEY: 63692d7661756c742d6b65792d6e6f742d612d7365637265740000000000000000000000

  engine:
    name: test engine + invocación (integraciones_engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integraciones
          POSTGRES_PASSWORD: integraciones
          # La cola de executions es GLOBAL (SKIP LOCKED): BD dedicada, la
          # imagen crea la base con este nombre al arrancar.
          POSTGRES_DB: integraciones_engine
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U integraciones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Suites del store y del plano de invocación
        run: |
          cargo test -p engine --test store_postgres \
            && cargo test -p api --test invocation_api
        env:
          # Los suites reescriben el dbname a `integraciones_engine`; la URL
          # solo aporta host/puerto/credenciales.
          DATABASE_URL: postgres://integraciones:integraciones@127.0.0.1:5433/integraciones_engine
          VAULT_KEY: 63692d7661756c742d6b65792d6e6f742d612d7365637265740000000000000000000000

  scheduler:
    name: test scheduler (integraciones_scheduler)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integraciones
          POSTGRES_PASSWORD: integraciones
          POSTGRES_DB: integraciones_scheduler
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U integraciones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Suite del scheduler cron
        run: cargo test -p api --test scheduler_api
        env:
          DATABASE_URL: postgres://integraciones:integraciones@127.0.0.1:5433/integraciones_scheduler
          VAULT_KEY: 63692d7661756c742d6b65792d6e6f742d612d7365637265740000000000000000000000

  e2e:
    name: test e2e MVP2 (integraciones_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integraciones
          POSTGRES_PASSWORD: integraciones
          POSTGRES_DB: integraciones_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U integraciones"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: E2E punta a punta (worker + webhook + scheduler)
        run: cargo test -p api --test e2e_mvp2 --test e2e_mvp3 --test e2e_mvp4
        env:
          DATABASE_URL: postgres://integraciones:integraciones@127.0.0.1:5433/integraciones_e2e
          VAULT_KEY: 63692d7661756c742d6b65792d6e6f742d612d7365637265740000000000000000000000
